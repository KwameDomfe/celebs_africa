{% extends 'base.html' %}
{% block title %}Register | African Celebs{% endblock %}
{% block content %}
<style>
.register-form input { padding: 0.50rem; width:100%; margin-top:0.5rem; max-width:300px; margin-bottom:0rem; }
</style>
<div>
    <h1>Register</h1>
    <div class="flex flex-column flex-row-m ggap2-00 items-center justify-center mb1-00">
        <div class="bg-white-10 w-50-m pa1-00 flex">
            <form method="post"
                class="w-100 register-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Register</button>
            </form>
        </div>
        <div class="bg-white-10 w-50-m pa1-00 w-100 flex">
            Already have an account?
            <a href="{% url 'login' %}" class="blue0">&nbsp; Login</a>
        </div>
    </div>
    <div class="mt1-0">
        <a href="{% url 'home' %}" class="blue0">Back to Home</a>
    </div>
</div>
{% endblock %}
