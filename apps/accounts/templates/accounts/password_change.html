{% extends 'base.html' %}
{% block title %}Change Password | African Celebs{% endblock %}
{% block content %}
<div class="pa1-00 white-90 h-100"><h1>Change Password</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="bg-red h2-00 white-90 b pa0-25 ba br0-25">Update Password</button>
  <a href="{% url 'profile' %}" class="white-90 h2-00 b pa0-25 ba br0-25" style="margin-left:12px;">Cancel</a>
</form>
{% endblock %}
