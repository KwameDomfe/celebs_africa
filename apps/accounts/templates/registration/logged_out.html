{% extends 'base.html' %}
{% block title %}Logged Out | Celebs Africa{% endblock %}
{% block meta_robots %}noindex,follow{% endblock %}
{% block content %}
<style>
.btn-save { background: red; color: #fff; border: none; border-radius: 4px; padding: 10px 28px; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.15s; }
.btn-save:hover { background: #c00; }
.btn-outline { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; padding: 10px 16px; border: 1px solid #333; border-radius: 4px; transition: border-color 0.15s, color 0.15s; display: inline-block; }
.btn-outline:hover { border-color: #666; color: rgba(255,255,255,0.85); }
</style>
<div class="pa1-00 white-90">
    <h2 style="margin: 0 0 8px; font-size: 1.4rem;">You've been logged out</h2>
    <p style="margin: 0 0 24px; color: #666; font-size: 0.95rem;">Thanks for visiting. See you next time.</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a href="{% url 'login' %}" class="btn-save">Login again</a>
        <a href="{% url 'home' %}" class="btn-outline">Back to Home</a>
    </div>
</div>
{% endblock %}
