{% extends 'base.html' %}
{% block title %}Delete Celeb | African Celebs{% endblock %}
{% block content %}
<style>
.form-actions { display: flex; gap: 10px; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #2a2a2a; }
.btn-danger { background: #b00; color: #fff; border: none; border-radius: 4px; padding: 10px 28px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: background 0.15s; }
.btn-danger:hover { background: #800; }
.btn-cancel { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; padding: 10px 16px; border: 1px solid #333; border-radius: 4px; transition: border-color 0.15s, color 0.15s; }
.btn-cancel:hover { border-color: #666; color: rgba(255,255,255,0.85); }
</style>

<div class="pa1-00 white-90">
    <h2 style="margin: 0 0 8px; font-size: 1.4rem;">Delete Celeb</h2>
    <p style="color: #888; margin: 0 0 24px; font-size: 0.95rem;">
        Are you sure you want to delete <strong style="color: rgba(255,255,255,0.88);">{{ celeb.name }}</strong>? This cannot be undone.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn-danger">Yes, Delete</button>
            <a href="{% url 'celebs_home' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
