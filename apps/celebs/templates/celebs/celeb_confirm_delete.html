{% extends 'base.html' %}
{% block title %}Delete Celeb | African Celebs{% endblock %}

{% block content %}

        <h1>Delete Celeb</h1>

        <a href="{% url 'celebs_home' %}">Cancel</a>
        </form>
    </div>
{% endblock %}
